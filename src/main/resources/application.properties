spring.application.name=book-store

spring.datasource.url=jdbc:mysql://${MYSQLDB_HOST:mysql}:\
  ${MYSQLDB_PORT:3306}/${MYSQLDB_DATABASE:bookstore}
spring.datasource.username=${MYSQLDB_USER:root}
spring.datasource.password=${MYSQLDB_PASSWORD:root}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

