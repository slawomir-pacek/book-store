databaseChangeLog:
  - changeSet:
      id: create-users-table
      author: slawomir
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: shipping_address
                  type: VARCHAR(255)

        - insert:
            tableName: users
            columns:
              - column:
                  name: email
                  value: admin@bookstore.com
              - column:
                  name: password
                  value: '$2a$10$GiuvZPHOINFHdx/kQTTrNOH/Ua2CaG8mA1LMZNaVXSZ6QM.ZZU.Bu'
              - column:
                  name: first_name
                  value: Admin
              - column:
                  name: last_name
                  value: Bookstore
              - column:
                  name: shipping_address
                  value: Admin address
